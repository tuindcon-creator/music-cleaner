name: Windows checks
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Real Windows installer
        shell: powershell
        run: .\setup_windows.ps1
      - run: .venv\Scripts\python.exe demucs_runner.py --help
      - run: .venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: GUI smoke check
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python.exe -c "from PySide6.QtWidgets import QApplication; from app import Window; a=QApplication([]); w=Window(); assert w.device.currentData()=='auto'; w.show(); a.processEvents(); w.close()"
